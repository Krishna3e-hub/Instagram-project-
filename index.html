<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05030a" />
  <title>dark_trd_osama // PHONK EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Inter:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       PHONK PROFILE EDIT v2 — ZERO-LAG 60FPS ANDROID EDITION
       Target: @dark_trd_osama (Exact 1080x2400 Pixel Calibration)
       ========================================================================= */

    :root {
      --bg-void: #05030a;
      --ig-dark: #0c0f14;
      --u: 3.6px; /* updated once on resize to phoneStageWidth / 100 */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-void);
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ultra-lightweight ambient floating sparks canvas (zero shadowBlur!) */
    #ambientCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Fast GPU-only edge glow flash on bass */
    #bassVignette {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 42%,
        rgba(168, 85, 247, 0) 45%,
        rgba(124, 58, 237, 0.28) 82%,
        rgba(168, 85, 247, 0.58) 100%);
      will-change: opacity;
    }

    /* Crisp 160ms Neon Flash Cut (no weird empty circles!) */
    #flashCut {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #c084fc 45%, #3b0764 100%);
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    #flashCut.boom {
      animation: quickCut 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes quickCut {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    /* =========================================================================
       STAGE 1: COMMENT INTRO OVERLAY (Sits ON TOP of already-loaded profile!)
       ========================================================================= */
    #introGate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background:
        radial-gradient(circle at 50% 35%, rgba(124, 58, 237, 0.25) 0%, #05030a 68%);
      transition: opacity 0.22s ease, transform 0.22s ease;
      will-change: opacity, transform;
    }

    #introGate.closing {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    #introGate.hidden {
      display: none;
    }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      margin-bottom: 22px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.14);
      border: 1px solid rgba(168, 85, 247, 0.55);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.3);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: #e9d5ff;
      text-transform: uppercase;
    }

    .intro-badge .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 10px #c084fc;
      animation: pulseDot 1.1s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .comment-card-wrap {
      position: relative;
      width: min(92vw, 410px);
      padding: 2.5px;
      border-radius: 18px;
      background: linear-gradient(135deg, #7c3aed, #00f0ff, #ec4899, #a855f7);
      box-shadow: 0 0 28px rgba(168, 85, 247, 0.42), 0 18px 40px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      animation: cardFloat 3s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes cardFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -6px, 0); }
    }

    .comment-card-inner {
      background: #0c0f14;
      border-radius: 15.5px;
      overflow: hidden;
      padding: 10px 8px;
    }

    #commentImg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .intro-subtext {
      margin-top: 18px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      color: rgba(233, 213, 255, 0.75);
      text-align: center;
    }

    .open-btn-wrap {
      position: relative;
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .open-btn-ring {
      position: absolute;
      inset: -7px;
      border-radius: 999px;
      border: 2px solid rgba(168, 85, 247, 0.65);
      animation: btnWave 1.8s ease-out infinite;
      pointer-events: none;
      will-change: transform, opacity;
    }

    @keyframes btnWave {
      0% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.34); opacity: 0; }
    }

    #openBtn {
      position: relative;
      z-index: 3;
      border: none;
      outline: none;
      cursor: pointer;
      min-width: 175px;
      padding: 15px 46px;
      border-radius: 999px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 3.5px;
      color: #ffffff;
      background: linear-gradient(135deg, #6d28d9 0%, #a855f7 52%, #ec4899 100%);
      box-shadow: 0 0 24px rgba(168, 85, 247, 0.8), 0 0 46px rgba(124, 58, 237, 0.45);
      transition: transform 0.14s ease, opacity 0.2s ease;
    }

    #openBtn.loading {
      opacity: 0.72;
      background: linear-gradient(135deg, #3b0764 0%, #6d28d9 100%);
      letter-spacing: 2px;
      font-size: 13px;
      cursor: wait;
    }

    #openBtn:active {
      transform: scale(0.94);
    }

    .sound-hint {
      margin-top: 15px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(216, 180, 254, 0.58);
      text-transform: uppercase;
      font-family: 'Rajdhani', sans-serif;
    }

    /* =========================================================================
       STAGE 2: PIXEL-LOCKED 9:20 PROFILE STAGE (PRE-PAINTED BEHIND INTRO!)
       ========================================================================= */
    #mainStageWrap {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Separate shake container so child styles NEVER recalculate */
    #shakeBox {
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    #phoneStage {
      position: relative;
      aspect-ratio: 1080 / 2400;
      height: min(100vh, calc(100vw * 2400 / 1080));
      width: min(100vw, calc(100vh * 1080 / 2400));
      background-color: var(--ig-dark);
      overflow: hidden;
      box-shadow: 0 0 38px rgba(124, 58, 237, 0.45);
    }

    /* Base profile screenshot — ALWAYS crisp & loaded before OPEN unlocks */
    #baseProfileImg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    /* Top Header Pill: PHONK EDITION • 0:00 (Clean, never covers "Digital creator"!) */
    #topPhonkHud {
      position: absolute;
      top: 0.72%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 26;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1.6);
      padding: calc(var(--u) * 0.45) calc(var(--u) * 2.4);
      border-radius: 999px;
      background: rgba(12, 15, 20, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.65);
      font-family: 'Orbitron', sans-serif;
      font-size: calc(var(--u) * 2.05);
      font-weight: 800;
      letter-spacing: calc(var(--u) * 0.35);
      color: #f3e8ff;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.9);
      pointer-events: none;
      white-space: nowrap;
    }

    #phonkTimer {
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.85);
    }

    /* =========================================================================
       DP PHONK VISUALIZER (Z: 14, BEHIND FACE) + CRYSTAL-CLEAR DP FACE (Z: 18)
       Exact Center: (18.009%, 18.438%) | Inner Face Diameter: 23.43%w
       ========================================================================= */
    /* Clean dark circle hiding the old static orange/pink IG story ring */
    #dpRingMask {
      position: absolute;
      left: 18.009%;
      top: 18.438%;
      width: 27.9%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #0c0f14;
      z-index: 10;
      pointer-events: none;
    }

    /* Neon Purple Phonk Ring + Spinning Blades + Liquid Wave Canvas (BEHIND DP FACE!) */
    #dpVisualizerCanvas {
      position: absolute;
      left: 18.009%;
      top: 18.438%;
      width: 54%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      z-index: 14;
      pointer-events: none;
    }

    /* Crystal-Clear Bass-Pulsing DP Face ON TOP of Visualizer (100% VISIBLE!) */
    #dpPulseWrapper {
      position: absolute;
      left: 18.009%;
      top: 18.438%;
      width: 23.6%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      z-index: 18;
      border: 2.2px solid #f5f3ff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.9);
      pointer-events: none;
      will-change: transform;
      background-color: #0c0f14;
    }

    /* Exact pixel-calibrated DP crop from profile.jpg */
    #dpPulseImg {
      position: absolute;
      width: 423.729%;
      height: 941.620%;
      left: -26.309%;
      top: -123.616%;
      object-fit: fill;
      filter: brightness(1.07) contrast(1.06);
      pointer-events: none;
    }

    /* =========================================================================
       VERIFIED BADGE NEXT TO @dark_trd_osama (UNLOCKS AT 100K)
       ========================================================================= */
    #verifiedBadge {
      position: absolute;
      left: 79.7%;
      top: 12.12%;
      width: calc(var(--u) * 4.9);
      height: calc(var(--u) * 4.9);
      z-index: 22;
      opacity: 0;
      transform: scale(0) rotate(-30deg);
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      pointer-events: none;
    }

    #verifiedBadge.unlocked {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* =========================================================================
       SEAMLESS LIVE FOLLOWERS COUNTER (EXACT MATCH OVER "945" IN #0c0f14)
       ========================================================================= */
    #followersPatch {
      position: absolute;
      left: 52.3%;
      top: 19.72%;
      width: 22.8%;
      height: 2.15%;
      z-index: 20;
      background-color: #0c0f14;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: calc(var(--u) * 0.45);
      overflow: visible;
    }

    #followerNum {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: calc(var(--u) * 4.35);
      line-height: 1;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(192, 132, 252, 0.85);
      white-space: nowrap;
      will-change: transform;
    }

    #followerNum.million {
      color: #f0abfc;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #a855f7, 0 0 28px #00f0ff;
    }

    .f-popup {
      position: absolute;
      left: 8%;
      top: -45%;
      font-family: 'Orbitron', sans-serif;
      font-size: calc(var(--u) * 2.45);
      font-weight: 800;
      color: #e879f9;
      text-shadow: 0 0 8px #a855f7;
      pointer-events: none;
      white-space: nowrap;
      animation: riseFade 1.05s ease-out forwards;
      will-change: transform, opacity;
    }

    @keyframes riseFade {
      0% { transform: translate3d(0, 0, 0) scale(0.8); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate3d(var(--dx, 10px), -36px, 0) scale(1.1); opacity: 0; }
    }

    /* Interactive Follow Button Hotspot */
    #followHotspot {
      position: absolute;
      left: 3.3%;
      top: 42.6%;
      width: 40.6%;
      height: 3.9%;
      z-index: 22;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #followHotspot.followed {
      background: linear-gradient(135deg, #6d28d9, #a855f7);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.85);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: calc(var(--u) * 3.6);
      color: #ffffff;
    }

    /* =========================================================================
       PSYCHOLOGICAL NEON BORDER + 6 GPU-SMOOTH FLOATING BUBBLE POSTS
       ========================================================================= */
    #postsSection {
      position: absolute;
      left: 0;
      top: 52.18%;
      width: 100%;
      height: 47.82%;
      z-index: 15;
      overflow: hidden;
    }

    /* Deep dark backing behind rows 1 & 2 so bubble gaps look super clean */
    .posts-void-backdrop {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 84.7%;
      background: #08060f;
      z-index: 1;
    }

    /* Lightweight Psychological Animated Outer Neon Border (pure GPU!) */
    .psycho-border {
      position: absolute;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      border: 3px solid #a855f7;
      box-shadow:
        inset 0 0 22px rgba(168, 85, 247, 0.8),
        inset 0 0 42px rgba(0, 240, 255, 0.35);
      animation: psychoBorderShift 2.8s linear infinite;
    }

    @keyframes psychoBorderShift {
      0%   { border-color: #a855f7; }
      33%  { border-color: #00f0ff; }
      66%  { border-color: #ec4899; }
      100% { border-color: #a855f7; }
    }

    /* Cyber HUD Corner Brackets */
    .hud-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 28;
      pointer-events: none;
      border-color: #00f0ff;
      border-style: solid;
    }
    .hud-tl { top: 5px; left: 5px; border-width: 3px 0 0 3px; }
    .hud-tr { top: 5px; right: 5px; border-width: 3px 3px 0 0; }
    .hud-bl { bottom: 5px; left: 5px; border-width: 0 0 3px 3px; }
    .hud-br { bottom: 5px; right: 5px; border-width: 0 3px 3px 0; }

    /* Pure GPU Transform Holographic Laser Sweep (translateY instead of top!) */
    .psycho-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 26;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, #00f0ff, #ffffff, #e879f9, transparent);
      box-shadow: 0 0 12px #00f0ff;
      animation: laserGpuSweep 2.6s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes laserGpuSweep {
      0%   { transform: translate3d(0, 0, 0); opacity: 0; }
      10%  { opacity: 0.85; }
      90%  { opacity: 0.85; }
      100% { transform: translate3d(0, 44vh, 0); opacity: 0; }
    }

    /* 6 Individual GPU-Composited Floating Bubble Post Tiles */
    .post-bubble {
      position: absolute;
      z-index: 10;
      border-radius: 10px;
      padding: 2px;
      cursor: pointer;
      background: linear-gradient(135deg, #a855f7, #00f0ff, #ec4899);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.55);
      will-change: transform;
      animation: bubbleBob 2.4s ease-in-out infinite alternate;
    }

    .post-bubble:nth-child(1) { animation-delay: 0.0s; }
    .post-bubble:nth-child(2) { animation-delay: -0.45s; }
    .post-bubble:nth-child(3) { animation-delay: -0.9s; }
    .post-bubble:nth-child(4) { animation-delay: -1.35s; }
    .post-bubble:nth-child(5) { animation-delay: -1.8s; }
    .post-bubble:nth-child(6) { animation-delay: -2.15s; }

    @keyframes bubbleBob {
      0%   { transform: translate3d(0, -2.5px, 0) scale(1); }
      100% { transform: translate3d(0, 3px, 0) scale(1.018); }
    }

    .post-bubble.popped {
      z-index: 40 !important;
      animation: none;
      transform: translate3d(0, -4px, 0) scale(1.08) !important;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.95);
    }

    .post-bubble-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #0c0f14;
    }

    .post-bubble-inner canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =========================================================================
       DISCREET FLOATING CONTROLS (AUTO-DIMS FOR CLEAN SCREEN RECORDING)
       ========================================================================= */
    #hudControls {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #hudControls.visible {
      opacity: 0.85;
      pointer-events: auto;
    }

    #hudControls.dimmed {
      opacity: 0.2;
    }

    #hudControls:hover, #hudControls:active {
      opacity: 1 !important;
    }

    .ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(168, 85, 247, 0.75);
      background: rgba(10, 6, 20, 0.85);
      color: #f3e8ff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <!-- Ultra-Lightweight Ambient Phonk Sparks Canvas -->
  <canvas id="ambientCanvas"></canvas>

  <!-- Bass Vignette & Crisp Transition Flash -->
  <div id="bassVignette"></div>
  <div id="flashCut"></div>

  <!-- =======================================================================
       STAGE 1: COMMENT INTRO SCREEN (Profile loads silently behind this!)
       ======================================================================= -->
  <section id="introGate" aria-label="Selected Comment Intro">
    <div class="intro-badge">
      <span class="live-dot"></span>
      <span>COMMENT SELECTED // PHONK EDIT</span>
    </div>

    <div class="comment-card-wrap" id="commentCard">
      <div class="comment-card-inner">
        <img
          id="commentImg"
          src="https://raw.githubusercontent.com/Krishna3e-hub/Instagram-project-/2c641dbbe9f94ba2a9dfc2824fc3b9fb3cdc44c3/comment.jpg"
          alt="dark_trd_osama comment"
          loading="eager"
          decoding="sync"
        />
      </div>
    </div>

    <div class="intro-subtext">@dark_trd_osama &bull; Custom Profile Overload</div>

    <div class="open-btn-wrap">
      <span class="open-btn-ring" id="btnRing"></span>
      <button id="openBtn" class="loading" type="button">LOADING...</button>
    </div>

    <div class="sound-hint">&#9889; Turn Volume Up For Full Phonk Bass &#9889;</div>
  </section>

  <!-- =======================================================================
       STAGE 2: PRE-RENDERED 1080x2400 INSTAGRAM PROFILE STAGE
       ======================================================================= -->
  <main id="mainStageWrap">
    <div id="shakeBox">
      <div id="phoneStage">

        <!-- Clean Top Header Pill (Never Covers "Digital creator"!) -->
        <div id="topPhonkHud">
          <span>PHONK EDITION</span>
          <span id="phonkTimer">0:00</span>
        </div>

        <!-- Base Profile Screenshot -->
        <img
          id="baseProfileImg"
          src="https://raw.githubusercontent.com/Krishna3e-hub/Instagram-project-/2c641dbbe9f94ba2a9dfc2824fc3b9fb3cdc44c3/profile.jpg"
          alt="dark_trd_osama Instagram Profile"
          crossorigin="anonymous"
          loading="eager"
        />

        <!-- Clean Mask Hiding Old Static IG Story Ring -->
        <div id="dpRingMask"></div>

        <!-- Neon Purple Phonk Visualizer Ring (Z: 14 — Strictly BEHIND DP Face!) -->
        <canvas id="dpVisualizerCanvas"></canvas>

        <!-- Crystal-Clear DP Face (Z: 18 — 100% VISIBLE & SHARP ON TOP!) -->
        <div id="dpPulseWrapper">
          <img
            id="dpPulseImg"
            src="https://raw.githubusercontent.com/Krishna3e-hub/Instagram-project-/2c641dbbe9f94ba2a9dfc2824fc3b9fb3cdc44c3/profile.jpg"
            alt=""
            loading="eager"
          />
        </div>

        <!-- Verified Badge (Unlocks at 100K) -->
        <svg id="verifiedBadge" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="55%" stop-color="#818cf8" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
          </defs>

          <path fill="#ffffff" d="M10.5 16.2l-3.3-3.3 1.4-1.4 1.9 1.9 4.9-4.9 1.4 1.4z"/>

        <div id="postsSection">

  <!-- Minimal Floating Controls -->

    <button class="ctrl-btn" id="toggleAudioBtn" type="button" title="Play / Pause">&#10074;&#10074;</button>
    <button class="ctrl-btn" id="replayBtn" type="button" title="Replay Intro">&#8635;</button>
  </div>

  <!-- Preloaded Phonk Song -->
  <audio
    id="phonkAudio"
    src="https://raw.githubusercontent.com/Krishna3e-hub/Instagram-project-/2c641dbbe9f94ba2a9dfc2824fc3b9fb3cdc44c3/song.mp3"
    crossorigin="anonymous"
    preload="auto"
    loop
  ></audio>

  <script>
    (() => {
      "use strict";

      /* =====================================================================
         1. ASSETS & EXACT PIXEL-CALIBRATED POST GRID
         ===================================================================== */
      const ASSETS = {
        profile: "https://raw.githubusercontent.com/Krishna3e-hub/Instagram-project-/2c641dbbe9f94ba2a9dfc2824fc3b9fb3cdc44c3/profile.jpg",
        song:    "https://raw.githubusercontent.com/Krishna3e-hub/Instagram-project-/2c641dbbe9f94ba2a9dfc2824fc3b9fb3cdc44c3/song.mp3"
      };

      const SECTION_TOP = 52.18;
      const SECTION_H   = 47.82;

      const POST_TILES = [
        { left: 0.000,  top: 52.333, width: 32.963, height: 20.084 },
        { left: 33.426, top: 52.333, width: 33.055, height: 20.084 },
        { left: 66.944, top: 52.333, width: 33.056, height: 20.084 },
        { left: 0.000,  top: 72.625, width: 32.963, height: 19.833 },
        { left: 33.426, top: 72.625, width: 33.055, height: 19.833 },
        { left: 66.944, top: 72.625, width: 33.056, height: 19.833 }
      ];

      /* =====================================================================
         2. DOM REFERENCES
         ===================================================================== */
      const introGate        = document.getElementById("introGate");
      const commentCard      = document.getElementById("commentCard");
      const openBtn          = document.getElementById("openBtn");
      const flashCut         = document.getElementById("flashCut");
      const shakeBox         = document.getElementById("shakeBox");
      const phoneStage       = document.getElementById("phoneStage");
      const baseProfileImg   = document.getElementById("baseProfileImg");
      const dpPulseWrapper   = document.getElementById("dpPulseWrapper");
      const dpCanvas         = document.getElementById("dpVisualizerCanvas");
      const ambientCanvas    = document.getElementById("ambientCanvas");
      const bassVignette     = document.getElementById("bassVignette");
      const phonkTimer       = document.getElementById("phonkTimer");
      const followerNumEl    = document.getElementById("followerNum");
      const followersPatch   = document.getElementById("followersPatch");
      const verifiedBadge    = document.getElementById("verifiedBadge");
      const postsBubbleLayer = document.getElementById("postsBubbleLayer");
      const hudControls      = document.getElementById("hudControls");
      const toggleAudioBtn   = document.getElementById("toggleAudioBtn");
      const replayBtn        = document.getElementById("replayBtn");
      const followHotspot    = document.getElementById("followHotspot");
      let   audioEl          = document.getElementById("phonkAudio");

      /* =====================================================================
         3. PRELOAD & SLICE 6 LIGHTWEIGHT BUBBLE POSTS ONCE (ZERO LAG!)
         Instead of decoding 1080x2400 profile.jpg 8 times, we decode ONCE and
         slice small ~260x350 canvas thumbnails (or fast CSS fallback if local).
         ===================================================================== */
      let assetsReady = false;
      let bubblesBuilt = false;

      function buildPostBubbles(sourceImg) {
        if (bubblesBuilt) return;
        bubblesBuilt = true;
        postsBubbleLayer.innerHTML = "";

        const imgW = sourceImg && sourceImg.naturalWidth ? sourceImg.naturalWidth : 1080;
        const imgH = sourceImg && sourceImg.naturalHeight ? sourceImg.naturalHeight : 2400;
        let canSliceCanvas = !!(sourceImg && sourceImg.complete && sourceImg.naturalWidth > 0);

        POST_TILES.forEach((tile) => {
          const insetX = 1.05;
          const insetY = 0.75;

          const relTop    = ((tile.top - SECTION_TOP) / SECTION_H) * 100 + insetY;
          const relHeight = (tile.height / SECTION_H) * 100 - insetY * 2;
          const relLeft   = tile.left + insetX;
          const relWidth  = tile.width - insetX * 2;

          const absLeft   = relLeft;
          const absWidth  = relWidth;
          const absTop    = SECTION_TOP + (relTop / 100) * SECTION_H;
          const absHeight = (relHeight / 100) * SECTION_H;

          const card = document.createElement("div");
          card.className = "post-bubble";
          card.style.left   = relLeft.toFixed(3) + "%";
          card.style.top    = relTop.toFixed(3) + "%";
          card.style.width  = relWidth.toFixed(3) + "%";
          card.style.height = relHeight.toFixed(3) + "%";

          const inner = document.createElement("div");
          inner.className = "post-bubble-inner";

          if (canSliceCanvas) {
            try {
              // Lightweight pre-cropped tile canvas (~240x320) -> ultra fast GPU texture!
              const c = document.createElement("canvas");
              c.width  = 240;
              c.height = 320;
              const ctx = c.getContext("2d");
              ctx.drawImage(
                sourceImg,
                (absLeft / 100) * imgW,
                (absTop / 100) * imgH,
                (absWidth / 100) * imgW,
                (absHeight / 100) * imgH,
                0, 0, c.width, c.height
              );
              inner.appendChild(c);
            } catch (_) {
              canSliceCanvas = false;
            }
          }

          if (!canSliceCanvas) {
            const fallbackImg = document.createElement("img");
            fallbackImg.src = ASSETS.profile;
            fallbackImg.style.position = "absolute";
            fallbackImg.style.width  = (100 / absWidth * 100).toFixed(3) + "%";
            fallbackImg.style.height = (100 / absHeight * 100).toFixed(3) + "%";
            fallbackImg.style.left   = (-(absLeft / absWidth) * 100).toFixed(3) + "%";
            fallbackImg.style.top    = (-(absTop / absHeight) * 100).toFixed(3) + "%";
            inner.appendChild(fallbackImg);
          }

          card.appendChild(inner);
          card.addEventListener("click", (e) => {
            e.stopPropagation();
            const wasPopped = card.classList.contains("popped");
            postsBubbleLayer.querySelectorAll(".post-bubble.popped").forEach(el => el.classList.remove("popped"));
            if (!wasPopped) {
              card.classList.add("popped");
              if (navigator.vibrate) navigator.vibrate(15);
            }
          });

          postsBubbleLayer.appendChild(card);
        });

        phoneStage.addEventListener("click", () => {
          postsBubbleLayer.querySelectorAll(".post-bubble.popped").forEach(el => el.classList.remove("popped"));
        });
      }

      function markReady() {
        if (assetsReady) return;
        assetsReady = true;
        buildPostBubbles(baseProfileImg);
        openBtn.classList.remove("loading");
        openBtn.textContent = "OPEN";
      }

      // Wait for profile.jpg to finish loading & decoding BEFORE unlocking OPEN!
      if (baseProfileImg.complete && baseProfileImg.naturalWidth > 0) {
        if (baseProfileImg.decode) {
          baseProfileImg.decode().then(markReady).catch(markReady);
        } else {
          markReady();
        }
      } else {
        baseProfileImg.addEventListener("load", () => {
          if (baseProfileImg.decode) {
            baseProfileImg.decode().then(markReady).catch(markReady);
          } else {
            markReady();
          }
        });
        baseProfileImg.addEventListener("error", () => {
          // If CORS attribute fails in strict local WebView, retry without crossorigin
          if (baseProfileImg.hasAttribute("crossorigin")) {
            baseProfileImg.removeAttribute("crossorigin");
            baseProfileImg.src = ASSETS.profile;
          } else {
            markReady();
          }
        });
      }
      // Safety unlock after 4s even on slow mobile data
      setTimeout(markReady, 4000);

      /* =====================================================================
         4. HYBRID WEB AUDIO FFT + FAILSAFE PHONK BEAT ENGINE
         ===================================================================== */
      let audioCtx      = null;
      let analyser      = null;
      let sourceNode    = null;
      let freqData      = null;
      let useSynthPulse = false;
      let zeroFrames    = 0;
      let isExperienceActive = false;
      let experienceStartMs  = 0;
      let isPlaying     = false;

      let smoothBass = 0;
      let smoothMid  = 0;
      let prevBass   = 0;
      let lastDropMs = 0;

      async function initAndPlayAudio() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) {
              audioCtx = new Ctx();
              analyser = audioCtx.createAnalyser();
              analyser.fftSize = 128; // smaller FFT = faster on mobile!
              analyser.smoothingTimeConstant = 0.72;
              sourceNode = audioCtx.createMediaElementSource(audioEl);
              sourceNode.connect(analyser);
              analyser.connect(audioCtx.destination);
              freqData = new Uint8Array(analyser.frequencyBinCount);
            }
          }
          if (audioCtx && audioCtx.state === "suspended") {
            await audioCtx.resume();
          }
          audioEl.currentTime = 0;
          await audioEl.play();
          isPlaying = true;
          zeroFrames = 0;
          useSynthPulse = false;
        } catch (err) {
          fallbackPlainAudio();
        }
      }

      function fallbackPlainAudio() {
        try { audioEl.pause(); } catch (_) {}
        const cleanAudio = new Audio(ASSETS.song);
        cleanAudio.loop = true;
        audioEl = cleanAudio;
        audioEl.play().then(() => { isPlaying = true; }).catch(() => {});
        useSynthPulse = true;
      }

      function sampleAudioEnergy(nowMs) {
        let rawBass = 0, rawMid = 0;
        let spectrum = null;

        if (analyser && freqData && !useSynthPulse && isPlaying) {
          analyser.getByteFrequencyData(freqData);
          let totalSum = 0;
          for (let i = 0; i < freqData.length; i++) totalSum += freqData[i];

          if (totalSum === 0 && !audioEl.paused && audioEl.currentTime > 0.35) {
            zeroFrames++;
            if (zeroFrames > 55) useSynthPulse = true;
          } else if (totalSum > 0) {
            zeroFrames = 0;
          }

          if (!useSynthPulse && totalSum > 0) {
            let bSum = 0, mSum = 0;
            for (let i = 0; i < 6; i++)  bSum += freqData[i];
            for (let i = 6; i < 24; i++) mSum += freqData[i];
            rawBass = Math.pow(bSum / (6 * 255), 1.3);
            rawMid  = Math.pow(mSum / (18 * 255), 1.15);
            spectrum = freqData;
          }
        }

        if (useSynthPulse && isPlaying) {
          const t = audioEl.currentTime || ((nowMs - experienceStartMs) / 1000);
          const beat = (t * (128 / 60)) % 1;
          const kick = Math.pow(Math.max(0, 1 - beat * 2.7), 2.1);
          const sub  = 0.22 + 0.18 * Math.sin(t * 6.5);
          rawBass = Math.min(1, kick * 0.92 + sub * 0.25);
          rawMid  = Math.min(1, Math.pow(Math.max(0, Math.sin(t * 13.4)), 4) * 0.6 + 0.22);

          if (!freqData) freqData = new Uint8Array(64);
          for (let i = 0; i < 64; i++) {
            const w = Math.sin(i * 0.5 + t * 10) * 0.5 + 0.5;
            const env = i < 12 ? rawBass : rawMid;
            freqData[i] = Math.min(255, (env * 0.8 + w * 0.25) * 255);
          }
          spectrum = freqData;
        }

        smoothBass = rawBass > smoothBass ? rawBass * 0.82 + smoothBass * 0.18 : smoothBass * 0.84 + rawBass * 0.16;
        smoothMid  = rawMid  > smoothMid  ? rawMid  * 0.72 + smoothMid  * 0.28 : smoothMid  * 0.86 + rawMid  * 0.14;

        const isHeavyDrop = (rawBass - prevBass > 0.16 && rawBass > 0.5 && (nowMs - lastDropMs > 240));
        if (isHeavyDrop) lastDropMs = nowMs;
        prevBass = rawBass;

        return { bass: smoothBass, mid: smoothMid, isHeavyDrop, spectrum };
      }

      /* =====================================================================
         5. ULTRA-FAST AMBIENT SPARKS CANVAS (ZERO shadowBlur = 60FPS!)
         ===================================================================== */
      const ambCtx = ambientCanvas.getContext("2d", { alpha: true });
      let ambW = 0, ambH = 0;
      const sparks = [];

      function resizeAll() {
        // Update font scaling unit ONCE on resize (no container-type layout thrash!)
        const stageW = phoneStage.clientWidth || Math.min(window.innerWidth, window.innerHeight * 0.45);
        document.documentElement.style.setProperty("--u", (stageW / 100).toFixed(3) + "px");

        // Cap DPR to 1.25 for razor-sharp visuals + buttery 60fps on Android WebView
        const dpr = Math.min(window.devicePixelRatio || 1, 1.25);

        ambW = window.innerWidth;
        ambH = window.innerHeight;
        ambientCanvas.width  = Math.floor(ambW * dpr);
        ambientCanvas.height = Math.floor(ambH * dpr);
        ambCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const dpSize = Math.round(stageW * 0.54 * dpr);
        if (dpSize > 0) {
          dpCanvas.width  = dpSize;
          dpCanvas.height = dpSize;
        }
      }

      function initSparks() {
        sparks.length = 0;
        for (let i = 0; i < 28; i++) {
          sparks.push({
            x: Math.random() * (window.innerWidth || 400),
            y: Math.random() * (window.innerHeight || 800),
            vx: (Math.random() - 0.5) * 0.5 + 0.25,
            vy: -(0.7 + Math.random() * 1.8),
            len: 6 + Math.random() * 12,
            alpha: 0.3 + Math.random() * 0.6,
            color: Math.random() > 0.45 ? "#c084fc" : "#ffffff"
          });
        }
      }

      function renderAmbient(bass) {
        ambCtx.clearRect(0, 0, ambW, ambH);
        const boost = 1 + bass * 3.2;
        ambCtx.lineWidth = 1.4;
        ambCtx.lineCap = "round";

        for (let i = 0; i < sparks.length; i++) {
          const p = sparks[i];
          p.x += p.vx * boost;
          p.y += p.vy * boost;
          if (p.y < -20 || p.x < -20 || p.x > ambW + 20) {
            p.x = Math.random() * ambW;
            p.y = ambH + 15;
          }
          ambCtx.strokeStyle = p.color;
          ambCtx.globalAlpha = Math.min(1, p.alpha * (0.65 + bass * 0.5));
          ambCtx.beginPath();
          ambCtx.moveTo(p.x, p.y);
          ambCtx.lineTo(p.x - p.vx * p.len, p.y - p.vy * p.len);
          ambCtx.stroke();
        }
        ambCtx.globalAlpha = 1;
      }

      /* =====================================================================
         6. DP PHONK VISUALIZER — ZERO shadowBlur + TRANSPARENT CENTER!
         Draws strictly OUTSIDE the DP face (behind z:18 #dpPulseWrapper) so
         the face stays 100% CRYSTAL CLEAR while purple phonk waves go crazy!
         ===================================================================== */
      const dpCtx = dpCanvas.getContext("2d", { alpha: true });
      let bladeAngle = 0;
      const ringSparks = [];

      function renderDpVisualizer(nowMs, energy) {
        const w = dpCanvas.width;
        const h = dpCanvas.height;
        if (!w || !h) return;

        const cx = w * 0.5;
        const cy = h * 0.5;
        // DP face diameter = 23.6% of stage inside 54%-wide canvas
        // => exact DP rim radius = (23.6 / 2 / 54) * w = 0.2185 * w
        const faceR = w * 0.224;
        const { bass, mid, isHeavyDrop, spectrum } = energy;
        const t = nowMs * 0.001;

        dpCtx.clearRect(0, 0, w, h);
        bladeAngle += (0.015 + bass * 0.06 + mid * 0.02);

        // --- LAYER 1: Outer Neon Purple Halo (TRANSPARENT inside faceR!) ---
        const outerHaloR = faceR * (1.58 + bass * 0.52);
        const halo = dpCtx.createRadialGradient(cx, cy, faceR * 0.92, cx, cy, outerHaloR);
        halo.addColorStop(0.00, "rgba(168, 85, 247, 0)");
        halo.addColorStop(0.18, `rgba(168, 85, 247, ${(0.52 + bass * 0.38).toFixed(3)})`);
        halo.addColorStop(0.55, `rgba(124, 58, 237, ${(0.22 + bass * 0.24).toFixed(3)})`);
        halo.addColorStop(1.00, "rgba(124, 58, 237, 0)");
        dpCtx.fillStyle = halo;
        dpCtx.beginPath();
        dpCtx.arc(cx, cy, outerHaloR, 0, Math.PI * 2);
        dpCtx.fill();

        // --- LAYER 2: Symmetrical Liquid Phonk Frequency Wave (Video Match!) ---
        const numPts = 48;
        const pts = new Array(numPts);
        for (let i = 0; i < numPts; i++) {
          const angle = (i / numPts) * Math.PI * 2 - Math.PI / 2;
          const symIdx = i <= numPts / 2 ? i : numPts - i;
          const bin = Math.min(28, Math.floor((symIdx / (numPts / 2)) * 20));
          const specVal = spectrum ? (spectrum[bin] / 255) : (bass * 0.85);

          const lobeA = Math.pow(Math.abs(Math.sin(angle * 2 + t * 2.4)), 1.5);
          const lobeB = Math.pow(Math.abs(Math.cos(angle * 3 - t * 3.2)), 1.8);
          const amp = (specVal * 0.65 + bass * 0.58) * (0.34 + lobeA * 0.44 + lobeB * 0.42);
          const r = faceR * (1.06 + amp * 0.46);

          pts[i] = { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
        }

        // Fast 3-pass layered neon bloom (zero shadowBlur = 20x faster!)
        traceSmoothLoop(dpCtx, pts);
        dpCtx.strokeStyle = "rgba(147, 51, 234, 0.34)";
        dpCtx.lineWidth = w * (0.042 + bass * 0.025);
        dpCtx.stroke();

        dpCtx.strokeStyle = "rgba(192, 132, 252, 0.85)";
        dpCtx.lineWidth = w * (0.018 + bass * 0.012);
        dpCtx.stroke();

        dpCtx.strokeStyle = "#ffffff";
        dpCtx.lineWidth = w * (0.007 + bass * 0.004);
        dpCtx.stroke();

        // --- LAYER 3: Spinning Sharp Phonk Razor Blades Around DP Rim ---
        const bladeCount = 8;
        dpCtx.save();
        dpCtx.translate(cx, cy);
        dpCtx.rotate(bladeAngle);

        // Outer magenta accent ring
        dpCtx.beginPath();
        dpCtx.arc(0, 0, faceR * (1.05 + mid * 0.06), 0, Math.PI * 2);
        dpCtx.strokeStyle = "rgba(236, 72, 153, 0.72)";
        dpCtx.lineWidth = w * 0.008;
        dpCtx.stroke();

        // Spinning white-violet phonk blades pointing outward
        dpCtx.fillStyle = "#f5f3ff";
        for (let i = 0; i < bladeCount; i++) {
          const a = (i / bladeCount) * Math.PI * 2;
          const tipR = faceR * (1.19 + bass * 0.16);
          dpCtx.beginPath();
          dpCtx.moveTo(Math.cos(a - 0.15) * faceR * 0.99, Math.sin(a - 0.15) * faceR * 0.99);
          dpCtx.lineTo(Math.cos(a) * tipR, Math.sin(a) * tipR);
          dpCtx.lineTo(Math.cos(a + 0.08) * faceR * 1.01, Math.sin(a + 0.08) * faceR * 1.01);
          dpCtx.closePath();
          dpCtx.fill();
        }
        dpCtx.restore();

        // --- LAYER 4: Outward Bass Sparks Bursting Off Rim ---
        if (isHeavyDrop && ringSparks.length < 28) {
          for (let i = 0; i < 8; i++) {
            const a = Math.random() * Math.PI * 2;
            ringSparks.push({
              a,
              d: faceR * 1.08,
              s: (2.2 + Math.random() * 3.5) * (w / 240),
              r: (1.4 + Math.random() * 1.8) * (w / 240),
              alpha: 1,
              c: i % 3 === 0 ? "#00f0ff" : (i % 2 === 0 ? "#ffffff" : "#d8b4fe")
            });
          }
        }

        for (let i = ringSparks.length - 1; i >= 0; i--) {
          const sp = ringSparks[i];
          sp.d += sp.s;
          sp.alpha -= 0.045;
          if (sp.alpha <= 0) {
            ringSparks.splice(i, 1);
            continue;
          }
          dpCtx.globalAlpha = sp.alpha;
          dpCtx.fillStyle = sp.c;
          dpCtx.beginPath();
          dpCtx.arc(cx + Math.cos(sp.a) * sp.d, cy + Math.sin(sp.a) * sp.d, sp.r, 0, Math.PI * 2);
          dpCtx.fill();
        }
        dpCtx.globalAlpha = 1;
      }

      function traceSmoothLoop(ctx, pts) {
        const len = pts.length;
        ctx.beginPath();
        const mx0 = (pts[len - 1].x + pts[0].x) * 0.5;
        const my0 = (pts[len - 1].y + pts[0].y) * 0.5;
        ctx.moveTo(mx0, my0);
        for (let i = 0; i < len; i++) {
          const p = pts[i];
          const n = pts[(i + 1) % len];
          ctx.quadraticCurveTo(p.x, p.y, (p.x + n.x) * 0.5, (p.y + n.y) * 0.5);
        }
        ctx.closePath();
      }

      /* =====================================================================
         7. LIVE SKYROCKETING FOLLOWERS (945 -> 1.0M+ + VERIFIED TICK)
         ===================================================================== */
      let currentFollowers = 945;
      let lastFormatted    = "945";
      let lastTimerStr     = "0:00";
      let verifiedUnlocked = false;
      let lastPopupMs      = 0;

      function formatFollowers(n) {
        if (n < 1000)    return Math.floor(n).toString();
        if (n < 10000)   return Math.floor(n).toLocaleString("en-US");
        if (n < 100000)  return (n / 1000).toFixed(1) + "K";
        if (n < 1000000) return Math.floor(n / 1000) + "K";
        return (n / 1000000).toFixed(2) + "M";
      }

      function spawnFollowerPopup(text) {
        const span = document.createElement("span");
        span.className = "f-popup";
        span.textContent = text;
        span.style.setProperty("--dx", ((Math.random() - 0.35) * 28).toFixed(1) + "px");
        followersPatch.appendChild(span);
        setTimeout(() => span.remove(), 1100);
      }

      function updateFollowers(nowMs, bass, isHeavyDrop) {
        const elapsedSec = (nowMs - experienceStartMs) / 1000;
        if (elapsedSec < 0.35) return;

        const t = elapsedSec - 0.35;
        let inc = 0;
        if (currentFollowers < 10000)        inc = 38 + t * 88 + bass * 230;
        else if (currentFollowers < 100000)  inc = 420 + bass * 1700;
        else if (currentFollowers < 1000000) inc = 3800 + bass * 15000;
        else                                 inc = 240 + bass * 2500;

        currentFollowers += inc;
        const formatted = formatFollowers(currentFollowers);
        if (formatted !== lastFormatted) {
          lastFormatted = formatted;
          followerNumEl.textContent = formatted;
        }

        const scale = 1 + bass * 0.14;
        followerNumEl.style.transform = `scale(${scale.toFixed(3)})`;

        if (!verifiedUnlocked && currentFollowers >= 100000) {
          verifiedUnlocked = true;
          verifiedBadge.classList.add("unlocked");
          spawnFollowerPopup("VERIFIED!");
        }

        if (currentFollowers >= 1000000 && !followerNumEl.classList.contains("million")) {
          followerNumEl.classList.add("million");
        }

        if ((isHeavyDrop || nowMs - lastPopupMs > 950) && nowMs - lastPopupMs > 460) {
          lastPopupMs = nowMs;
          const lbl =
            currentFollowers < 10000   ? "+180" :
            currentFollowers < 100000  ? "+2.5K" :
            currentFollowers < 1000000 ? "+25K" : "+10K";
          spawnFollowerPopup(lbl);
        }
      }

      /* =====================================================================
         8. STAGE MOTION (GPU-ONLY TRANSFORM ON #shakeBox + DP PULSE)
         ===================================================================== */
      function updateMotion(energy) {
        const { bass, isHeavyDrop } = energy;

        // Subtle crisp pulse on DP face
        const dpScale = 1 + bass * 0.055;
        dpPulseWrapper.style.transform = `translate3d(-50%, -50%, 0) scale(${dpScale.toFixed(4)})`;

        // Smooth bass micro-shake on outer #shakeBox (zero layout thrash!)
        if (bass > 0.38 && isPlaying) {
          const amp = (bass - 0.38) * (isHeavyDrop ? 10 : 4.5);
          const sx = (Math.random() - 0.5) * amp;
          const sy = (Math.random() - 0.5) * amp;
          const z  = 1 + (bass - 0.35) * 0.038;
          shakeBox.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0) scale(${z.toFixed(4)})`;
        } else {
          shakeBox.style.transform = "translate3d(0, 0, 0) scale(1)";
        }

        bassVignette.style.opacity = isPlaying ? Math.min(0.88, bass * bass * 1.15).toFixed(2) : "0";

        if (audioEl) {
          const sec = Math.floor(audioEl.currentTime || 0);
          const str = `${Math.floor(sec / 60)}:${sec % 60 < 10 ? "0" : ""}${sec % 60}`;
          if (str !== lastTimerStr) {
            lastTimerStr = str;
            phonkTimer.textContent = str;
          }
        }
      }

      /* =====================================================================
         9. MASTER 60FPS ANIMATION LOOP
         ===================================================================== */
      function renderLoop(nowMs) {
        requestAnimationFrame(renderLoop);
        const energy = sampleAudioEnergy(nowMs);
        renderAmbient(energy.bass);

        if (isExperienceActive) {
          renderDpVisualizer(nowMs, energy);
          updateFollowers(nowMs, energy.bass, energy.isHeavyDrop);
          updateMotion(energy);
        }
      }

      /* =====================================================================
         10. INSTANT ZERO-DELAY TRANSITION ON OPEN CLICK
         ===================================================================== */
      let dimTimeout = null;
      function scheduleHudDim() {
        hudControls.classList.remove("dimmed");
        clearTimeout(dimTimeout);
        dimTimeout = setTimeout(() => hudControls.classList.add("dimmed"), 3000);
      }

      function launchExperience() {
        if (!assetsReady || isExperienceActive) return;
        if (navigator.vibrate) navigator.vibrate([20, 25, 40]);

        // 1. Activate profile logic & audio at the EXACT same instant!
        isExperienceActive = true;
        experienceStartMs  = performance.now();
        currentFollowers   = 945;
        lastFormatted      = "945";
        verifiedUnlocked   = false;
        followerNumEl.textContent = "945";
        followerNumEl.classList.remove("million");
        verifiedBadge.classList.remove("unlocked");

        initAndPlayAudio();

        // 2. Crisp 160ms flash cut straight into the ALREADY-LOADED profile!
        flashCut.classList.remove("boom");
        void flashCut.offsetWidth;
        flashCut.classList.add("boom");

        introGate.classList.add("closing");
        hudControls.classList.add("visible");
        scheduleHudDim();

        setTimeout(() => {
          introGate.classList.add("hidden");
        }, 220);
      }

      openBtn.addEventListener("click", launchExperience);
      commentCard.addEventListener("click", launchExperience);

      toggleAudioBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        scheduleHudDim();
        if (audioEl.paused) {
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          audioEl.play().catch(() => {});
          isPlaying = true;
          toggleAudioBtn.innerHTML = "&#10074;&#10074;";
        } else {
          audioEl.pause();
          isPlaying = false;
          toggleAudioBtn.innerHTML = "&#9654;";
        }
      });

      replayBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        try {
          audioEl.pause();
          audioEl.currentTime = 0;
        } catch (_) {}
        isPlaying = false;
        isExperienceActive = false;
        shakeBox.style.transform = "translate3d(0, 0, 0) scale(1)";
        bassVignette.style.opacity = "0";
        dpCtx.clearRect(0, 0, dpCanvas.width, dpCanvas.height);

        hudControls.classList.remove("visible", "dimmed");
        introGate.classList.remove("hidden", "closing");
        toggleAudioBtn.innerHTML = "&#10074;&#10074;";
        followHotspot.classList.remove("followed");
        followHotspot.textContent = "";
      });

      followHotspot.addEventListener("click", (e) => {
        e.stopPropagation();
        const active = followHotspot.classList.toggle("followed");
        followHotspot.textContent = active ? "Following ✓" : "";
        if (active) {
          spawnFollowerPopup("+1 LEGEND");
          if (navigator.vibrate) navigator.vibrate(20);
        }
      });

      window.addEventListener("resize", resizeAll);
      window.addEventListener("orientationchange", () => setTimeout(resizeAll, 150));

      resizeAll();
      initSparks();
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
